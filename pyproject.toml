[project]
name = "notty"
version = "2.15.31"
description = "A simple card game called Notty using Pygame"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
  { name = "Azeez" },
  { name = "Hanmiao chen" },
  { name = "Winipedia2" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
dependencies = [
  "platformdirs>=4.13.4",
  "pygame>=2.6.1",
  "pyrig>=19.2.0",
  "pyrig-runtime>=3.27.0",
]

[project.urls]
Changelog = "https://github.com/Winipedia/notty/releases"
Documentation = "https://Winipedia.github.io/notty"
Homepage = "https://github.com/Winipedia/notty"
Issues = "https://github.com/Winipedia/notty/issues"
Source = "https://github.com/Winipedia/notty"

[project.scripts]
notty = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "mkdocstrings[python]>=1.0.7",
  "mypy>=2.4.0",
  "pillow>=13.0.0",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.5",
  "pyflakes>=4.0.3",
  "pyinstaller>=6.22.3",
  "pyorder>=0.5.1",
  "pyrig-codecov>=3.18.0",
  "pyrig-codeql>=1.2.0",
  "pyrig-executables>=3.20.0",
  "pyrig-public>=1.2.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.1",
  "rumdl>=0.3.0",
  "ryl>=0.26.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.8.7",
  "typos>=1.51.1",
  "vulture>=2.16",
  "zensical>=0.0.71",
  "zizmor>=1.31.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = []
show_error_code_links = true
files = "."

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=0",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=notty",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.lint]
strict = true

[tool.ryl.lint.rules]
ALL = "enable"
key-ordering = "disable"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
